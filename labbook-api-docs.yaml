openapi: 3.0.0
info:
  title: LabBook Python API
  version: "1.0.0"
  description: REST API for LabBook laboratory data management
servers:
  - url: http://localhost:5000/sigl
security:
  - oauth2: []
paths:
  /services/test:
    get:
      summary: Test GET endpoint
      security:
        - oauth2: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Test GET OK"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Test POST endpoint
      security:
        - oauth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "args = {...}"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /services/external/analysis/code/check/{code}:
    get:
      summary: Check analysis code (external)
      parameters:
        - name: code
