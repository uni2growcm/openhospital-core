components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Success:
      type: object
      additionalProperties: true
    YesNoFlag:
      type: string
      description: Generic yes/no flag
      enum: [Y, N]
    PatientDet:
      type: object
      properties:
        id_data:
          type: integer
          description: Unique identifier of the patient record
    Patient:
      type: object
      required: [id_data, id_owner, code, code_lab, lastname]
      properties:
        id_data:
          type: integer
          description: Unique identifier of the patient record
        id_owner:
          type: integer
          description: ID of the user who owns or created the patient record
        code:
          type: string
          description: Internal patient code
          example: "428"
        code_lab:
          type: string
          description: Laboratory code associated with the patient
          example: "LAB-7781"
        lastname:
          type: string
        firstname:
          type: string
        midname:
          type: string
        maidenname:
          type: string
        birth:
          type: string
          format: date
        birth_approx:
          type: integer
          description: Birth date approximation level
        sex:
          type: integer
          description: |
            Sex code:
            0 = Unknown
            1 = Male
            2 = Female
        phone1:
          type: string
        phone2:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        zipcode:
          type: string
        city:
          type: string
        suburb:
          type: string
        job:
          type: string
        pbox:
          type: string
        resident:
          $ref: "#/components/schemas/YesNoFlag"
        lite:
          type: integer
        agreement:
          $ref: "#/components/schemas/YesNoFlag"
    PatientDetRequest:
      type: object
      required:
        - id_user
      properties:
        id_user:
          type: integer
          description: User ID creating/updating the patient
        pat_ano:
          type: integer
          description: Anonymity level
          default: 5
        pat_code:
          type: string
          description: Patient code
        pat_code_lab:
          type: string
          description: Lab patient code
          default: ""
        pat_name:
          type: string
          description: Patient last name
          default: ""
        pat_firstname:
          type: string
          description: Patient first name
          default: ""
        pat_birth:
          type: string
          format: date
          description: Patient birth date (ISO date format)
        pat_sex:
          type: integer
          description: Patient sex (1=Male, 2=Female, 3=Unknown)
          default: 3
        pat_address:
          type: string
          description: Patient address
          default: ""
        pat_zipcode:
          type: string
          description: Patient zip code
          default: ""
        pat_city:
          type: string
          description: Patient city
          default: ""
        pat_phone1:
          type: string
          description: Patient primary phone
          default: ""
        pat_phone2:
          type: string
          description: Patient secondary phone
          default: ""
        pat_profession:
          type: string
          description: Patient profession
          default: ""
        pat_maiden:
          type: string
          description: Patient maiden name
          default: ""
        pat_district:
          type: string
          description: Patient district
          default: ""
        pat_pbox:
          type: string
          description: Patient post box
          default: ""
        pat_birth_approx:
          type: integer
          description: Birth date approximation (4=Yes, 5=No)
          default: 5
        pat_age:
          type: integer
          description: Patient age
          default: 0
        pat_age_unit:
          type: integer
          description: Age unit
          default: 0
        pat_midname:
          type: string
          description: Patient middle name
          default: ""
        pat_nationality:
          type: integer
          description: Patient nationality
          default: 0
        pat_resident:
          $ref: "#/components/schemas/YesNoFlag"
        pat_blood_group:
          type: integer
          description: Blood group
          default: 0
        pat_blood_rhesus:
          type: integer
          description: Blood rhesus
          default: 0
        pat_email:
          type: string
          description: Patient email
          default: ""
        pat_agreement:
          $ref: "#/components/schemas/YesNoFlag"
    PatientListRequest:
      type: object
      properties:
        code:
          type: string
          description: Filter by patient code (partial match)
        code_lab:
          type: string
          description: Filter by lab patient code (partial match)
    OauthToken:
        type: object
        properties:
          access_token:
            type: string
            description: The access token issued by the authorization server
          token_type:
            type: string
            description: The type of the token (e.g., "Bearer")
          expires_in:
            type: integer
            description: The lifetime in seconds of the access token
    Oauth2GrantType:
      type: string
      enum: [password, client_credentials, authorization_code, refresh_token]
    Oauth2TokenRequest:
      type: object
      required: [grant_type, client_id, client_secret] # Well cover only client_credentials grant type, but can be extended for others
      properties:
        grant_type:
          $ref: '#/components/schemas/Oauth2GrantType'
        client_id:
          type: string
          description: The client ID issued to the client during the registration process
        client_secret:
          type: string
          description: The client secret issued to the client during the registration process
    ResultCreate:
      type: object
      required:
        - id_owner
        - user_role
      properties:
        id_owner:
          type: integer
          description: The ID of the user creating the results
        user_role:
          type: string
          description: The role of the user
        list_ref:
          type: array
          items:
            type: object
            properties:
              ref_analyse:
                type: integer
                description: Reference to the analysis
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: http://localhost:5000/sigl/oauth/authorize
          scopes: {}
